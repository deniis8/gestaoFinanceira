<app-sheet [titulo]="titulo()" (fechar)="fechar.emit()">
  <div class="resumo">
    <span class="texto-2">{{ mesAno() }}</span>
    <span class="texto-2">Total <strong class="money is-saida">R$ {{ total() | formatValor }}</strong></span>
  </div>

  <ul class="linhas">
    @for (item of itens(); track item.id) {
      <li>
        <button type="button" class="linha" [attr.aria-expanded]="expandido() === item.id" (click)="alternar(item.id)">
          <span class="linha-texto">
            <span class="linha-titulo">{{ item.descricaoLancamento }}</span>
            <span class="linha-meta"><time>{{ item.dataHora | date: 'dd/MM/yyyy HH:mm' }}</time></span>
          </span>
          <span class="linha-valor money">R$ {{ item.valor | formatValor }}</span>
        </button>

        @if (expandido() === item.id) {
          <div class="linha-acoes">
            <a class="btn btn-outline btn-sm" [routerLink]="['/lancamento/edit', item.id]">
              <app-icon nome="editar" /> Editar
            </a>
            <button type="button" class="btn btn-outline btn-sm excluir" (click)="excluir.emit(item)">
              <app-icon nome="lixeira" /> Excluir
            </button>
          </div>
        }
      </li>
    }
  </ul>
</app-sheet>
