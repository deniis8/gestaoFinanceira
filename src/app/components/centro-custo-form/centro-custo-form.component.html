<form class="formulario" [formGroup]="centroCustoForm" (ngSubmit)="submit()" novalidate>

  <div class="field" [class.invalido]="mostrarErro('descriCCusto')">
    <label for="descricao">Nome</label>
    <input id="descricao" type="text" formControlName="descriCCusto" maxlength="50" autocomplete="off"
           placeholder="Ex.: Alimentação"
           [attr.aria-invalid]="mostrarErro('descriCCusto')"
           [attr.aria-describedby]="mostrarErro('descriCCusto') ? 'descricao-erro' : null" />
    @if (mostrarErro('descriCCusto')) { <p class="field-erro" id="descricao-erro">Dê um nome ao centro de custo.</p> }
  </div>

  <div class="field" [class.invalido]="mostrarErro('valorLimite')">
    <label for="valor-limite">Limite mensal</label>
    <div class="campo-valor">
      <span class="rs" aria-hidden="true">R$</span>
      <input id="valor-limite" type="text" appMoeda formControlName="valorLimite" placeholder="0,00"
             [attr.aria-invalid]="mostrarErro('valorLimite')"
             [attr.aria-describedby]="mostrarErro('valorLimite') ? 'limite-erro' : 'limite-dica'" />
    </div>
    @if (mostrarErro('valorLimite')) {
      <p class="field-erro" id="limite-erro">Informe o limite mensal.</p>
    } @else {
      <p class="field-dica" id="limite-dica">Nos Gráficos, a barra do centro de custo se enche até esse valor.</p>
    }
  </div>

  <div class="form-acoes">
    <button type="button" class="btn btn-outline" (click)="cancelar.emit()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="enviando()">
      @if (enviando()) { <span class="spinner"></span> Salvando } @else { {{ btnText() }} }
    </button>
  </div>
</form>
