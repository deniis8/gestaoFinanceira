<div class="page">
  <header class="form-head">
    <button type="button" class="btn btn-quiet btn-icon" aria-label="Voltar" (click)="voltar()">
      <app-icon nome="voltar" />
    </button>
    <h1 class="titulo-pagina">{{ edicao() ? 'Editar centro de custo' : 'Novo centro de custo' }}</h1>
  </header>

  @if (!edicao() || centroCusto()) {
    <app-centro-custo-form
      [centroCustoData]="centroCusto()"
      [btnText]="edicao() ? 'Salvar alterações' : 'Registrar'"
      [enviando]="enviando()"
      (salvar)="salvar($event)"
      (cancelar)="voltar()" />
  } @else if (falhou()) {
    <div class="vazio">
      <strong>Não foi possível abrir este centro de custo</strong>
      Ele pode ter sido excluído ou o servidor não respondeu.
      <br>
      <button type="button" class="btn btn-outline" (click)="voltar()">Voltar</button>
    </div>
  } @else {
    <div class="formulario" aria-hidden="true">
      <span class="sk" style="height: 2.875rem; width: 100%"></span>
      <span class="sk" style="height: 3.5rem; width: 60%; margin-top: 1.5rem"></span>
    </div>
  }
</div>
