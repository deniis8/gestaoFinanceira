<div class="shell" [class.sem-menu]="naLogin()" [class.foco]="foco()">

  @if (!naLogin()) {
    <aside class="lateral">
      <a class="marca" routerLink="/home">Gestão Financeira</a>

      <a class="btn btn-primary novo-lancamento" routerLink="/lancamento/novo">
        <app-icon nome="mais" /> Novo lançamento
      </a>

      <nav aria-label="Principal">
        <ul>
          @for (item of menu; track item.rota) {
            <li>
              <a [routerLink]="item.rota" routerLinkActive="ativo" ariaCurrentWhenActive="page">
                <app-icon [nome]="item.icone" /> {{ item.rotulo }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <button type="button" class="sair" (click)="sair()">
        <app-icon nome="sair" /> Sair
      </button>
    </aside>
  }

  <main class="conteudo">
    <router-outlet />
  </main>

  @if (!naLogin()) {
    <nav class="abas" aria-label="Principal">
      <a routerLink="/home" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <app-icon nome="extrato" /> <span>Lançamentos</span>
      </a>
      <a routerLink="/graficos" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <app-icon nome="grafico" /> <span>Gráficos</span>
      </a>
      <a class="novo" routerLink="/lancamento/novo" aria-label="Novo lançamento">
        <span class="botao"><app-icon nome="mais" [espessura]="2.2" /></span>
      </a>
      <a routerLink="/lancamento-fixo" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <app-icon nome="repetir" /> <span>Fixos</span>
      </a>
      <button type="button" [class.ativo]="maisAtivo()" (click)="maisAberto.set(true)">
        <app-icon nome="reticencias" /> <span>Mais</span>
      </button>
    </nav>
  }
</div>

@if (maisAberto()) {
  <app-sheet titulo="Mais opções" [pequeno]="true" (fechar)="maisAberto.set(false)">
    <ul class="opcoes">
      @for (item of menuMais; track item.rota) {
        <li>
          <a [routerLink]="item.rota" (click)="maisAberto.set(false)">
            <app-icon [nome]="item.icone" /> {{ item.rotulo }}
          </a>
        </li>
      }
      <li>
        <button type="button" (click)="sair()"><app-icon nome="sair" /> Sair</button>
      </li>
    </ul>
  </app-sheet>
}

<app-feedback-host />
